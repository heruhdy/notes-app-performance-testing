name: CI Quality Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint - ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit_test:
    name: Unit Test - Jest Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --ci

      - name: Verify LCOV coverage report
        run: test -s coverage/lcov.info

      - name: Upload Jest coverage
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  dependency_audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - unit_test
      - dependency_audit

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Jest coverage
        uses: actions/download-artifact@v8
        with:
          name: jest-coverage
          path: coverage

      - name: Verify downloaded LCOV report
        run: test -s coverage/lcov.info

      - name: Run SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
